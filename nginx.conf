worker_processes auto;
events {
    worker_connections 2048;
}
http {
    resolver 127.0.0.11 valid=5s;
    client_max_body_size 25M;

    upstream laravel_cluster {
        server laravel.test:9000 max_fails=2 fail_timeout=5s;
    }

    upstream reverb_cluster {
        server laravel.test:8081 max_fails=2 fail_timeout=5s;
    }

    server {
        listen 80;
        server_name localhost;
        root /var/www/html/public;
        index index.php index.html index.htm;

        location /app/ {
            proxy_pass http://reverb_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        location /apps/ {
            proxy_pass http://reverb_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass laravel_cluster;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_next_upstream error timeout invalid_header http_500 http_503;
            fastcgi_connect_timeout 10s;
            fastcgi_read_timeout 60s;
            fastcgi_send_timeout 60s;
        }
    }
}
